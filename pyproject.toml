[project]
name = "piforge"
version = "0.1.0"
description = "Code-first toolkit to design, simulate, validate and export Raspberry Pi devices: electronics, 3D-printed mechanics and firmware (digital twin)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "build123d>=0.13",
    "trimesh>=4.5",
    "manifold3d>=3.0",
    "embreex>=2.17",
    "rtree>=1.3",
    "shapely>=2.0",
    "networkx>=3.0",
    "numpy>=2.0",
    "scipy>=1.13",
    "matplotlib>=3.9",
    "pillow>=10.0",
    "gpiozero>=2.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "websockets>=12.0",
    "typer>=0.12",
    "rich>=13.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
twin = [
    # real Raspberry Pi drivers validated against the digital twin (Blinka is shadowed by twin shims)
    "adafruit-circuitpython-bme280>=2.6",
    "adafruit-circuitpython-ssd1306>=2.12",
    "adafruit-circuitpython-framebuf>=1.6",
    "RPLCD>=1.3",
]
dev = [
    "piforge[twin]",
    "pytest>=8.0",
    "pytest-timeout>=2.3",
    "httpx>=0.27",
    "playwright>=1.45",
]

[project.scripts]
piforge = "piforge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/piforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
timeout = 900
markers = [
    "slow: OCP/build123d-heavy test (CAD booleans, tessellation)",
    "spice: needs the ngspice binary",
    "gui: browser end-to-end test (Playwright)",
]
filterwarnings = [
    "ignore::DeprecationWarning:pkg_resources.*",
]
